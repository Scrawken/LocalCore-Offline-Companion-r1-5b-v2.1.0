# LocalCore-Create — FLUX.1-schnell LoRA reference config (Stage 1: image identity)
# REFERENCE ONLY until first training run. Target framework: diffusers / kohya sd-scripts.
# Hardware target: 24GB+ GPU. DO NOT run on RTX 3060 12GB (offload-only, impractically slow).

base_model: black-forest-labs/FLUX.1-schnell   # Apache 2.0
license_note: "FLUX.1-dev is non-commercial and must never be substituted here."

resolution: 1024
aspect_ratio_bucketing: true

network:
  type: lora
  rank: 16                  # try 32 if style adherence is weak
  alpha: 16
  target: attention         # attention layers only; keep 4-step schnell speed intact

datasets:
  - path: ../data/generated/style_v1/           # git-ignored; see data/README.md
    caption_extension: .txt
    repeats: 10

optimizer: adamw_8bit
learning_rate: 1.0e-4
lr_scheduler: constant_with_warmup
warmup_steps: 100
max_train_steps: 3000
train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
mixed_precision: bf16

timestep_sampling: flux_shift
guidance_scale: 3.5         # schnell distillation expects low guidance; do not raise

save_every_n_steps: 500
output_dir: ../checkpoints/create-flux-lora-stage1   # git-ignored

# Eval gate reminders (see ../README.md):
# - style + character consistency, human-reviewed
# - still <= 4 steps at 1024px on RTX 3060 inference
# - inference VRAM no larger than stock schnell
