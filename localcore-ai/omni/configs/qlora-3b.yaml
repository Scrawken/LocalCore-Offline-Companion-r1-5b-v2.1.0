# LocalCore-Omni — QLoRA reference config (Stage 1: text persona, TEXT CORE)
# REFERENCE ONLY until first training run. Target framework: axolotl or HF TRL + PEFT.
# Hardware target: RTX 3060 12GB.
#
# The text core is a Llama 3.1 derivative so that Dolphin 3.0 8B (Llama license)
# can legally serve as the distillation teacher. Vision/speech stay on Qwen2.5-Omni
# encoders (Apache 2.0) and are trained separately in Stages 2-3.

base_model: models/text-core/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf   # TODO: add setup:text-core script
model_type: LlamaForCausalLM
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

# Stage 1 trains the text core only. Vision/speech encoders are a separate model
# (Qwen2.5-Omni) trained in later stages; nothing to freeze here.

adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

datasets:
  - path: ../data/generated/persona_sft_v1.jsonl   # git-ignored; see data/README.md
    type: chat_template
    split: train
val_set_size: 0.02

sequence_len: 4096          # matches current chat contextLength
sample_packing: true
micro_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true

optimizer: paged_adamw_8bit
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_steps: 50
num_epochs: 2
max_steps: -1

logging_steps: 10
save_steps: 250
output_dir: ../checkpoints/omni-qlora-stage1   # git-ignored

# Eval gate reminders (see ../README.md):
# - npm run test:chat-model / test:chat-context fixtures must pass
# - persona probe set, human-reviewed
# - VRAM + latency no worse than current llama.cpp pipeline
