# LocalCore-Audio — Stable Audio Open Small LoRA reference config
# REFERENCE ONLY until first training run. Target framework: stable-audio-tools.
# Hardware target: 24GB+ GPU. DO NOT run on RTX 3060 12GB.

base_model: stabilityai/stable-audio-open-small
license_note: >
  Stability Community License — free below $1M annual revenue; paid license
  required past that threshold. MusicGen (CC-BY-NC) must never be substituted
  as a base or teacher for this commercial-bound project.

sample_rate: 44100
sample_size: 441000         # 10s clips; extend to 30s after loop quality is proven
audio_channels: 2

network:
  type: lora
  rank: 16
  alpha: 16
  target: diffusion_transformer

datasets:
  - path: ../data/generated/music_beds_v1/      # git-ignored; see data/README.md
    metadata: metadata.jsonl                    # prompt, mood, intensity, loopable flag

optimizer: adamw
learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_steps: 100
max_train_steps: 5000
train_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
mixed_precision: bf16

save_every_n_steps: 500
output_dir: ../checkpoints/audio-saos-lora-v1   # git-ignored

# Eval gate reminders (see ../README.md):
# - loop seamlessness (automated + human)
# - mood/intensity prompt adherence (human panel)
# - 10s clip in <= 30s on RTX 3060 inference
# - blind A/B vs MusicGen-small: not "much worse" for majority of reviewers
